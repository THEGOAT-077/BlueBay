<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BlueBay</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;600;700;800&display=swap">
<style>
:root{--bg:#eaf1f9;--card:#fff;--text:#0c1c33;--muted:#5a6b82;--line:#dfe7f1;--brand:#0f62fe;--free:#12a150;--taken:#d93a3a;--unk:#7a8797;--on:#fff;--land:#e6ecf4;--bldg:#d6dfeb;--road:#fff;--casing:#c8d3e1;--park:#c6e7c3;--water:#9fcbf2;--shadow:0 6px 24px rgba(12,28,51,.18);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#070e1b;--card:#101a2c;--text:#e8eff9;--muted:#93a4ba;--line:#1f2d44;--brand:#3d85ff;--free:#34c474;--taken:#ff6b6b;--unk:#8896a8;--on:#07121f;--land:#14202f;--bldg:#1b293c;--road:#27374f;--casing:#0d1624;--park:#173826;--water:#0f2c4b;--shadow:0 6px 24px rgba(0,0,0,.5);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#070e1b;--card:#101a2c;--text:#e8eff9;--muted:#93a4ba;--line:#1f2d44;--brand:#3d85ff;--free:#34c474;--taken:#ff6b6b;--unk:#8896a8;--on:#07121f;--land:#14202f;--bldg:#1b293c;--road:#27374f;--casing:#0d1624;--park:#173826;--water:#0f2c4b;--shadow:0 6px 24px rgba(0,0,0,.5);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:500 15px/1.4 Figtree,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;display:flex;justify-content:center;-webkit-tap-highlight-color:transparent}
.app{width:100%;max-width:430px;height:100%;display:flex;flex-direction:column;background:var(--card);position:relative;overflow:hidden}
@media(min-width:500px){.app{box-shadow:var(--shadow)}}
header{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line)}
.logo{width:36px;height:36px;border-radius:11px;background:var(--brand);display:grid;place-items:center}
.logo svg{width:22px;height:22px}
h1{margin:0;font-size:19px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
header small{color:var(--muted);font-size:12px}
.chip{margin-left:auto;display:flex;align-items:center;gap:6px;padding:6px 11px;border-radius:99px;background:var(--bg);font-size:13px;font-weight:700}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.mapwrap{flex:1;min-height:170px;position:relative;background:var(--land);overflow:hidden}
#map{width:100%;height:100%;display:block;overflow:visible;touch-action:manipulation}
.pin{cursor:pointer;outline:none}.pin:focus-visible path{stroke:var(--text)}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1.8s ease-out infinite}
@keyframes pulse{from{transform:scale(.5);opacity:.5}to{transform:scale(1.7);opacity:0}}
@keyframes flow{to{stroke-dashoffset:-14}}
.rflow{stroke-dasharray:2 12;stroke-linecap:round;animation:flow .8s linear infinite}
@media(prefers-reduced-motion:reduce){.pulse,.rflow{animation:none}}
.rl{font-size:9px;font-weight:700;fill:var(--muted)}
.pl{font-size:12px;font-weight:800;fill:var(--text);paint-order:stroke;stroke:var(--card);stroke-width:4px;stroke-linejoin:round}
.legend{position:absolute;top:10px;left:10px;display:flex;gap:10px;padding:7px 11px;border-radius:12px;background:var(--card);box-shadow:var(--shadow);font-size:12px;font-weight:600}
.legend span{display:flex;align-items:center;gap:5px}
.fab{position:absolute;right:12px;bottom:14px;display:flex;align-items:center;gap:8px;padding:13px 18px;border:0;border-radius:99px;background:var(--brand);color:#fff;font:700 14px Figtree,system-ui,sans-serif;box-shadow:var(--shadow);cursor:pointer}
.fab[hidden]{display:none}
.fab svg,.btn svg{width:18px;height:18px;flex:none}
.toast{position:absolute;top:56px;left:50%;transform:translate(-50%,-8px);max-width:88%;padding:9px 14px;border-radius:12px;background:var(--text);color:var(--card);font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:.2s;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.sheet{background:var(--card);border-radius:20px 20px 0 0;margin-top:-14px;position:relative;z-index:2;padding:10px 16px 16px;box-shadow:0 -6px 24px rgba(12,28,51,.12);max-height:55%;overflow:auto;flex:none}
.grab{width:36px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 12px}
.row{display:flex;align-items:center;gap:10px}
h2{margin:0;font-size:18px;font-weight:800;letter-spacing:-.01em;flex:1}
.badge{padding:3px 11px;border-radius:99px;font-size:12px;font-weight:700;color:var(--on)}
.meta{margin:3px 0 12px;color:var(--muted);font-size:13px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{display:flex;align-items:center;justify-content:center;gap:7px;min-height:46px;padding:0 12px;border:1.5px solid var(--line);border-radius:13px;background:var(--card);color:var(--text);font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;width:100%}
.btn.primary{background:var(--brand);border-color:transparent;color:#fff}
.btn.free{color:var(--free);border-color:var(--free)}.btn.taken{color:var(--taken);border-color:var(--taken)}
.btn:disabled{opacity:.38;cursor:not-allowed}
.btn:focus-visible,.fab:focus-visible{outline:3px solid var(--text);outline-offset:2px}
.q{font-size:13px;font-weight:700;margin:14px 0 7px}
.x{border:0;background:var(--bg);color:var(--text);width:32px;height:32px;border-radius:50%;display:grid;place-items:center;cursor:pointer}
.x svg{width:16px;height:16px}
.mine{background:var(--bg);border-radius:13px;padding:11px 13px;margin-bottom:10px;font-size:14px}
.steps{list-style:none;margin:0 0 12px;padding:0;max-height:24dvh;overflow:auto}
.steps li{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.steps li span{color:var(--muted);flex:none}
.pop{position:absolute;z-index:3;width:244px;padding:13px;border-radius:16px;background:var(--card);box-shadow:var(--shadow);animation:popin .16s ease-out}
.pop[hidden]{display:none}
.pop::after{content:"";position:absolute;left:var(--tx,50%);bottom:-6px;width:14px;height:14px;background:var(--card);transform:translateX(-50%) rotate(45deg);border-radius:3px}
.pop.below::after{bottom:auto;top:-6px}
.pop b{display:block;font-size:16px;font-weight:800;padding-right:28px}
.pop span{display:block;color:var(--muted);font-size:12px;margin:1px 0 10px}
.pop .btn{min-height:40px;font-size:13px}
.pop .x{position:absolute;top:9px;right:9px;width:26px;height:26px}
@keyframes popin{from{opacity:0;transform:scale(.92)}}
@media(prefers-reduced-motion:reduce){.pop{animation:none}}
#map{position:absolute;inset:0;width:auto;height:auto;z-index:0}
.mk{position:relative;transform-origin:bottom center;transition:transform .12s;cursor:pointer}
.mk.on{transform:scale(1.3)}
.mk svg{display:block}
.mk.mine::before{content:"";position:absolute;left:50%;bottom:-8px;width:30px;height:30px;margin-left:-15px;border-radius:50%;background:var(--brand);opacity:.4;animation:pulse 1.8s ease-out infinite}
.you{width:18px;height:18px;box-sizing:border-box;border-radius:50%;background:var(--brand);border:3px solid #fff;transform:translateY(50%);animation:ring 2s ease-out infinite}
@keyframes ring{from{box-shadow:0 0 0 0 rgba(15,98,254,.5)}to{box-shadow:0 0 0 18px rgba(15,98,254,0)}}
.cross{position:absolute;left:50%;top:50%;transform:translate(-50%,-100%);pointer-events:none;z-index:4}
.cross[hidden]{display:none}
.fab.alt{left:12px;right:auto;padding:13px;background:var(--card);color:var(--text)}
.err{padding:28px 22px;color:var(--muted);font-size:14px;line-height:1.55}
.err code{background:var(--bg);padding:2px 6px;border-radius:6px;word-break:break-all}
@media(prefers-reduced-motion:reduce){.you,.mk.mine::before{animation:none}}
.votes{display:flex;gap:6px;flex:none}
.vbtn{display:flex;align-items:center;gap:4px;min-height:36px;padding:0 10px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--text);font:700 13px Figtree,system-ui,sans-serif;cursor:pointer}
.vbtn svg{width:16px;height:16px}
.vbtn.on{background:var(--brand);border-color:var(--brand);color:#fff}.vbtn.on.down{background:var(--taken);border-color:var(--taken)}
.vbtn:disabled{opacity:.38;cursor:not-allowed}.vbtn:focus-visible{outline:3px solid var(--text);outline-offset:2px}
.who{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.who small{display:block;color:var(--muted);font-size:12px}.who b{font-size:14px}.score{color:var(--muted);font-size:12px;font-weight:600}
.meta a{color:var(--brand);font-weight:700}
.area{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}.area>small{display:block;color:var(--muted);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px}.facts div{background:var(--bg);border-radius:12px;padding:9px 11px}.facts b{display:block;font-size:16px;font-weight:800}.facts span{display:block;color:var(--muted);font-size:12px;line-height:1.3}
.src{margin:8px 0 0;color:var(--muted);font-size:11px}
.gap{list-style:none;margin:0 0 10px;padding:0}.gap li{padding:9px 0;border-bottom:1px solid var(--line)}.gap b{display:block;font-size:14px}.gap span{display:block;color:var(--muted);font-size:12px}
.gap i{display:block;height:6px;border-radius:6px;background:var(--taken);margin-top:6px}
.far{margin:-4px 0 12px;padding:9px 12px;border-radius:12px;background:var(--bg);color:var(--muted);font-size:13px;font-weight:600}
.avatar{flex:none;width:36px;height:36px;border-radius:50%;border:0;background:var(--bg);color:var(--text);font:800 14px Figtree,system-ui,sans-serif;cursor:pointer;display:grid;place-items:center;position:relative}
.avatar.guest::after{content:"";position:absolute;right:0;top:0;width:10px;height:10px;border-radius:50%;background:var(--taken);border:2px solid var(--card)}
.avatar:focus-visible{outline:3px solid var(--text);outline-offset:2px}
.field{width:100%;box-sizing:border-box;min-height:46px;padding:0 14px;border:1.5px solid var(--line);border-radius:13px;background:var(--card);color:var(--text);font:600 15px Figtree,system-ui,sans-serif;margin-bottom:8px}
.field:focus{outline:none;border-color:var(--brand)}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px;margin:12px 0}.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.btn.g svg{width:18px;height:18px}
.bdg{display:inline-flex;align-items:center;gap:4px;padding:2px 8px 2px 6px;border-radius:99px;font-size:11px;font-weight:800;letter-spacing:.02em;vertical-align:1px;color:#fff;white-space:nowrap}
.bdg svg{width:12px;height:12px}
.b-blue{background:#1f6feb}.b-bronze{background:#a8642f}.b-silver{background:#6f7d8c}.b-gold{background:#b8860b}
.b-platinum{background:linear-gradient(135deg,#3e6f7d,#7fa9b5 50%,#3e6f7d)}
.prog{height:8px;border-radius:8px;background:var(--line);overflow:hidden;margin:8px 0 4px}.prog i{display:block;height:100%;border-radius:8px;background:var(--brand)}
.tiers{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 12px}.tiers .bdg{opacity:.35}.tiers .bdg.got{opacity:1}
</style>
</head>
<body>

<div class="app">
<header>
<div class="logo"><svg><use href="#isa"/></svg></div>
<div><h1>BlueBay</h1><small>Accessible parking, checked by people</small></div>
<div class="chip"><i class="dot" style="background:var(--free)"></i><span id="count"></span></div>

<div class="legend"><span><i class="dot" style="background:var(--free)"></i>Free</span><span><i class="dot" style="background:var(--taken)"></i>Taken</span><span><i class="dot" style="background:var(--unk)"></i>Unsure</span><span><i class="dot" style="background:var(--brand)"></i>Yours</span></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
<script>
// ---- Settings: paste your own values here ----
const CONFIG={API_KEY:'AIzaSyCDeuDe6vj-51ayn547DOiv9XQS_KO1s4A',MAP_ID:'DEMO_MAP_ID',CENTER:{lat:-33.8688,lng:151.2093},RADIUS:1500,
 SUPABASE_URL:'https://dkzslyosezumvdhykvrk.supabase.co',SUPABASE_KEY:'sb_publishable_bOUQEgEyyzXT62h3qVclbg_t_cl0oUE'};
const $=i=>document.getElementById(i);
const sb=supabase.createClient(CONFIG.SUPABASE_URL,CONFIG.SUPABASE_KEY);
let db={spots:{},mine:null},uid=null,myName='',people={},myUserVotes={},busy=false,isGuest=true,myEmail='',acct=false,gapView=false,gapData=null;const areaC={};
const spots=()=>Object.values(db.spots),find=i=>db.spots[i];
let map,ov,AM,Route,youM,poly,me=null,sel=null,route=null,ask=null,adding=false,tt;const markers={};
const col={free:'var(--free)',taken:'var(--taken)',unk:'var(--unk)',mine:'var(--brand)'},lbl={free:'Free',taken:'Taken',unk:'Unsure',mine:'Yours'};
const kind=s=>s.mine?'mine':s.s,ico=n=>`<svg><use href="#${n}"/></svg>`;
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const agoT=t=>{if(!t)return'never';const m=Math.floor((Date.now()-t)/6e4);return m<1?'just now':m<60?m+' min ago':m<1440?Math.floor(m/60)+' h ago':Math.floor(m/1440)+' d ago'};
const fmt=m=>m==null?'':m>=1000?(m/1000).toFixed(1)+' km':Math.round(m/10)*10+' m';
const hav=(a,b)=>{const r=x=>x*Math.PI/180,h=Math.sin(r(b.lat-a.lat)/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(r(b.lng-a.lng)/2)**2;return 12742e3*Math.asin(Math.sqrt(h))};
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('show'),3000)}

// ---- Supabase: sign-in, loading and live updates ----
// Everyone starts as a guest (anonymous account). Signing in with email or
// Google upgrades that same account, so name, captures and votes are kept.
const BACK=location.origin+location.pathname;
async function useSession(session){
 const u=session.user;uid=u.id;isGuest=!!u.is_anonymous;myEmail=u.email||'';
 const {data:p}=await sb.from('profiles').select('display_name').eq('id',uid).maybeSingle();myName=p?.display_name||'';
 await loadMyVotes();
}
async function signIn(){
 authReturn();
 let {data:{session}}=await sb.auth.getSession();
 if(!session){const r=await sb.auth.signInAnonymously();if(r.error)throw r.error;session=r.data.session}
 await useSession(session);
}
// Handle errors Supabase puts in the URL after an email or Google redirect.
function authReturn(){
 const q=new URLSearchParams(location.hash.slice(1)+'&'+location.search.slice(1)),code=q.get('error_code');if(!code)return;
 history.replaceState(null,'',BACK);
 if(code==='identity_already_exists'){toast('That Google account already uses BlueBay. Signing you in…');sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:BACK}})}
 else setTimeout(()=>toast(q.get('error_description')||'Sign-in link didn’t work. Try again.'),300);
}
const ready=signIn().catch(e=>{console.error(e);toast('Couldn’t sign in: '+e.message)});
sb.auth.onAuthStateChange((ev,session)=>{
 if(!session||ev==='TOKEN_REFRESHED'||ev==='INITIAL_SESSION')return;
 if(session.user.id!==uid||session.user.is_anonymous!==isGuest||(session.user.email||'')!==myEmail)
  setTimeout(()=>useSession(session).then(()=>{if(ev==='SIGNED_IN'||ev==='USER_UPDATED')!isGuest&&toast('Signed in. Your account is saved.');return load()}),0);
});
async function loadMyVotes(){
 const {data}=await sb.from('user_votes').select('target_id,vote').eq('voter_id',uid);
 myUserVotes={};(data||[]).forEach(v=>myUserVotes[v.target_id]=v.vote);
}
async function loadPeople(){
 const ids=[...new Set([uid,...spots().flatMap(s=>[s.capBy,s.repBy,s.src==='user'?s.by:null])].filter(Boolean))];if(!ids.length)return;
 const [a,b]=await Promise.all([sb.from('profile_scores').select('*').in('id',ids),sb.from('profile_badges').select('id,points,pins_added,pins_up,pins_down,badge').in('id',ids)]);
 (a.data||[]).forEach(p=>people[p.id]={...people[p.id],...p});(b.data||[]).forEach(p=>people[p.id]={...people[p.id],...p});
}
// Only load bays near the map (about 5 km each way), not the whole database.
let loadedAt=null;
async function load(){
 await ready;
 const c=map?{lat:map.getCenter().lat(),lng:map.getCenter().lng()}:me||CONFIG.CENTER;loadedAt=c;
 const {data,error}=await sb.from('bay_status').select('*')
  .gte('lat',c.lat-.045).lte('lat',c.lat+.045).gte('lng',c.lng-.055).lte('lng',c.lng+.055).limit(1000);
 if(error){console.error(error);return toast('Couldn’t load bays. Check your connection.')}
 const next={};let mine=null;
 data.forEach(b=>{const s={id:b.id,name:b.name,lat:b.lat,lng:b.lng,s:b.status,n:b.confirmations,
  t:b.status_at?Date.parse(b.status_at):0,checked:b.last_checked_at?Date.parse(b.last_checked_at):0,
  src:b.source,osm:b.osm_ref,by:b.created_by,score:b.score,up:b.upvotes,down:b.downvotes,vote:b.my_vote,
  capBy:b.captured_by,capName:b.captured_by_name,repBy:b.last_reported_by,repName:b.last_reported_by_name,
  mine:!!uid&&b.captured_by===uid};next[s.id]=s;if(s.mine)mine=s.id});
 db={spots:next,mine};

 if(a==='end'){clearRoute();return render()}
 if(a==='go'){const d=route.spot;return window.open(`https://www.google.com/maps/dir/?api=1&destination=${d.lat},${d.lng}&travelmode=driving`,'_blank')}
 if(a==='rename'){const n=prompt('Your display name (2 to 30 characters)',myName);if(n===null)return;const v=n.trim();
  if(v.length<2||v.length>30)return toast('Names need 2 to 30 characters.');
  const {error}=await sb.from('profiles').update({display_name:v}).eq('id',uid);if(error)return toast(why(error));myName=v;toast('Name updated.');return render()}
 if(a==='release-mine')return release(db.mine);
 if(a==='acct-close'){acct=false;return render()}
 if(a==='gap'){gapView=true;sel=ask=null;render();return loadGap()}
 if(a==='gap-close'){gapView=false;return render()}
 if(a==='google')return google();
 if(a==='signout'){await sb.auth.signOut();uid=null;await signIn();acct=false;toast('Signed out. You’re a guest now.');return load()}
 if(!s)return;
 if((a==='pvote'||a==='uvote')&&isGuest){acct=true;render();return toast('Sign in to vote.')}
 if(a==='dir'){toast('Finding the route…');const r=await routeTo(s);return r&&showRoute(r)}
 if(busy)return;busy=true;
 try{
  if(a==='capture'){
   if(s.s==='taken'||s.mine)return;
   if(db.mine)return toast(`Release ${find(db.mine).name} before capturing another spot.`);
   const {error}=await sb.from('captures').insert({bay_id:s.id,...from()});if(error)return toast(why(error));
   if(route&&route.spot.id===s.id)clearRoute();toast('Spot captured. Others now see it as taken.');
  }else if(a==='release')return release(s.id);
  else if(a==='free'||a==='taken'){
   const {error}=await sb.from('reports').insert({bay_id:s.id,status:a,...from()});if(error)return toast(why(error));
   if(a==='taken'&&route&&route.spot.id===s.id)clearRoute();toast(a==='free'?'Thanks. Marked as free.':'Thanks. Marked as taken.');
  }else if(a==='pvote'){
   const v=+el.dataset.v,q=sb.from('pin_votes');
   const {error}=s.vote===v?await q.delete().eq('bay_id',s.id).eq('user_id',uid):s.vote?await q.update({vote:v}).eq('bay_id',s.id).eq('user_id',uid):await q.insert({bay_id:s.id,vote:v});
   if(error)return toast(why(error));
  }else if(a==='uvote'){
   const id=s.capBy&&!s.mine?s.capBy:s.repBy,v=+el.dataset.v,cur=myUserVotes[id],q=sb.from('user_votes');
   const {error}=cur===v?await q.delete().eq('voter_id',uid).eq('target_id',id):cur?await q.update({vote:v}).eq('voter_id',uid).eq('target_id',id):await q.insert({target_id:id,vote:v});
   if(error)return toast(why(error));await loadMyVotes();
  }
  ask=null;await load();
 }finally{busy=false}
}
async function release(id){
 if(!id)return;
 const {error}=await sb.from('captures').update({ended_at:new Date().toISOString()}).eq('bay_id',id).eq('user_id',uid).is('ended_at',null);
 if(error)return toast(why(error));
 ask=null;toast('Spot released. It now shows as free.');await load();
}
$('sheet').addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&!b.disabled){e.preventDefault();act(b.dataset.a,b)}});
$('pop').addEventListener('click',e=>{const b=e.target.closest('[data-q]');if(!b)return;const s=find(sel);
 if(b.dataset.q==='close'){ask=null;return render()}
 if(s)act(b.dataset.q==='yes'?s.s:s.s==='free'?'taken':'free')});
// ---- Logging in ----
// Guest + new email: the guest account gets that email (after they tap the link).
// Email already has an account: send a normal sign-in link instead.
async function emailLink(email){
 if(isGuest){
  const {error}=await sb.auth.updateUser({email},{emailRedirectTo:BACK});
  if(!error)return toast('Check your email and tap the link to finish.');
  if(error.code!=='email_exists'&&!/already/i.test(error.message)){console.error(error);return toast(error.message)}
 }
 const {error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:BACK}});
 if(error){console.error(error);return toast(error.status===429?'Too many emails sent. Wait a bit and try again.':error.message)}
 toast('Check your email for a sign-in link.');
}
async function google(){
 const {error}=isGuest?await sb.auth.linkIdentity({provider:'google',options:{redirectTo:BACK}})
  :await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:BACK}});
 if(error){console.error(error);toast(/manual linking/i.test(error.message)?'Turn on manual linking in Supabase first.':/provider is not enabled/i.test(error.message)?'Google sign-in isn’t set up in Supabase yet.':error.message)}
}
$('sheet').addEventListener('submit',e=>{if(e.target.id!=='emailf')return;e.preventDefault();const v=$('email').value.trim();if(v)emailLink(v)});
$('acct').addEventListener('click',()=>{acct=!acct;if(acct){clearRoute();adding=false;$('cross').hidden=true;sel=ask=null}render()});
$('fab').addEventListener('click',()=>act('near'));
$('loc').addEventListener('click',()=>{if(me&&map){map.panTo(me);map.setZoom(17)}else toast('Turn on location to centre the map on you.')});
addEventListener('resize',place);
render();
</script>
</body>
</html>
